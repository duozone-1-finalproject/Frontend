server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CORS 설정을 location 블록으로 이동하여 중복 및 if 블록 문제 해결
    location / {
        # SPA 라우팅
        try_files $uri /index.html;

        # CORS 헤더는 여기서 한 번만 설정
        # credentials 허용 시, allow-origin에 와일드카드(*) 사용 불가
        # 프론트엔드 URL이 'http://localhost:3000'이라고 가정
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # OPTIONS 요청 처리를 위한 별도 location 블록
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 백엔드 API 프록시 - /backend 제거하고 전달
    location /backend/ {
        proxy_pass http://backend.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 엔드포인트 프록시
    location /api/ {
        proxy_pass http://backend.default.svc.cluster.local:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI API 프록시
    location /ai/ {
        proxy_pass http://ai.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 프록시
    location /fastapi/ {
        proxy_pass http://fastapi.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 에러 페이지
    # =========================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}