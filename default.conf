server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # [개선] 공통 프록시 헤더 설정을 포함합니다.
    # Dockerfile에서 이 파일이 복사될 경로에 맞게 수정해야 합니다. (예: /etc/nginx/conf.d/proxy_params.conf)
    include /etc/nginx/proxy_params.conf;

    # 백엔드 API 프록시 - /backend 제거하고 전달
    location /backend/ {
        proxy_pass http://backend.default.svc.cluster.local:80/;
    }

    # API 엔드포인트 프록시
    location /api/ {
        proxy_pass http://backend.default.svc.cluster.local:80/api/;
    }

    # AI API 프록시
    location /ai/ {
        proxy_pass http://ai.default.svc.cluster.local:80/;
    }

    # FastAPI 프록시
    location /fastapi/ {
        proxy_pass http://fastapi.default.svc.cluster.local:80/;
    }

    # [개선] CORS Preflight 요청을 위한 OPTIONS 메서드 처리
    # 모든 API 경로에 대해 OPTIONS 요청이 오면 204를 반환하고 즉시 종료합니다.
    location ~ ^/(backend|api|ai|fastapi)/ {
        if ($request_method = 'OPTIONS') {
            # 백엔드에서 실제 CORS 헤더를 설정하므로 여기서는 응답만 보냅니다.
            # 백엔드에서 설정한 헤더가 이 응답에 포함되어야 합니다.
            # add_header 'Access-Control-Allow-Origin' ...
            # add_header 'Access-Control-Allow-Methods' ...
            # add_header 'Access-Control-Allow-Headers' ...
            return 204;
        }
        # OPTIONS가 아닌 경우, 각 location 블록의 proxy_pass가 처리합니다.
    }

    # 정적 파일 캐싱
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # =========================================================
    # SPA 라우팅 (맨 마지막에 둬야 함)
    # =========================================================
    location / {
        try_files $uri /index.html;
        # [수정] 불필요하고 잘못된 위치에 있던 CORS 헤더를 제거합니다.
    }

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
