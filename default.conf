server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드 API 프록시 - /backend 제거하고 전달
    location /backend/ {
        proxy_pass http://backend.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 엔드포인트 프록시
    location /api/ {
        proxy_pass http://backend.default.svc.cluster.local:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI API 프록시
    location /ai/ {
        proxy_pass http://ai.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 프록시
    location /fastapi/ {
        proxy_pass http://fastapi.default.svc.cluster.local:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 파일 캐싱
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # =========================================================
    # SPA 라우팅 (맨 마지막에 둬야 함)
    # =========================================================
    location / {
        try_files $uri /index.html;

        # CORS 헤더
        add_header 'Access-Control-Allow-Origin' 'http://k8s-default-ingress-164f943143-1716141576.ap-northeast-2.elb.amazonaws.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Requested-With' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
