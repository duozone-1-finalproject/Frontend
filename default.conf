server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # 1️⃣ 정적 파일 캐시
    # =========================================================
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # =========================================================
    # 2️⃣ 백엔드 API 프록시 (Spring Boot)
    # =========================================================
    location /api/ {
        proxy_pass http://backend.default.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 3️⃣ AI API 프록시
    # =========================================================
    location /ai/ {
        proxy_pass http://ai.default.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 4️⃣ FastAPI 프록시
    # =========================================================
    location /fastapi/ {
        proxy_pass http://fastapi.default.svc.cluster.local:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================
    # 5️⃣ SPA 라우팅 (React Router)
    # =========================================================
    # API, AI, FastAPI와 정확히 구분되도록 가장 마지막에 위치
    location / {
        try_files $uri /index.html;
    }

    # =========================================================
    # 6️⃣ 에러 페이지
    # =========================================================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
