name: CI/CD - Build & Deploy Frontend

on:
  push:
    branches:
      - main  # 배포 기준 브랜치

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: srg/frontend
  KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}  # base64 인코딩 kubeconfig
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Node.js 설치 및 빌드
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (ignore warnings)
        run: CI=false npm run build

      # 3️⃣ AWS 로그인
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 4️⃣ ECR 로그인
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUN
